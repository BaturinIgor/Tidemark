name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core logic tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test TidemarkCore
        working-directory: Packages/TidemarkCore
        run: swift test

  app:
    name: Build app and run tests
    runs-on: macos-15
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          status=0
          xcodebuild test \
            -project Tidemark.xcodeproj \
            -scheme Tidemark \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1 || status=$?
          grep -E "error:|Test (Suite|Case)|✔|✘|\*\* " xcodebuild.log | tail -200 || true
          if [ "$status" -ne 0 ]; then
            echo "::group::Last 150 lines of xcodebuild.log"
            tail -150 xcodebuild.log
            echo "::endgroup::"
          fi
          exit $status
      - name: Check every string is translated
        run: |
          xcodebuild -exportLocalizations \
            -project Tidemark.xcodeproj \
            -localizationPath "$RUNNER_TEMP/loc" \
            -exportLanguage en \
            -sdk iphonesimulator > export.log 2>&1 || { tail -80 export.log; exit 1; }
          python3 tools/l10n.py keys "$RUNNER_TEMP/loc/en.xcloc/Localized Contents/en.xliff" > keys.txt
          echo "$(wc -l < keys.txt) keys exported from the app"
          python3 tools/l10n.py check keys.txt
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
