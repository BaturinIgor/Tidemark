name: Design screens

# Mockups of every screen, state and popup (design/<version>/screens) on a 6.9-inch iPhone,
# light and dark, on made-up data. UITests/DesignCatalogUITests takes them through
# the screen catalog in App/DesignGallery.swift. The PNG files are uploaded as the
# design-screens artifact and committed to the branch in design/<version>/screens.

on:
  workflow_dispatch:
  push:
    branches:
      - "design/**"
  pull_request:
    paths:
      - App/DesignGallery.swift
      - UITests/DesignCatalogUITests.swift
      - .github/workflows/design.yml

permissions:
  contents: write

concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Boot a 6.9-inch iPhone
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if "Pro Max" in x["name"]))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3

      - name: Take design screenshots
        env:
          TEST_RUNNER_DESIGN_DIR: ${{ github.workspace }}/design-screens
        run: |
          set -o pipefail
          mkdir -p design-screens
          xcodebuild test -project Tidemark.xcodeproj -scheme Design \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:TidemarkUITests/DesignCatalogUITests \
            -derivedDataPath build CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            > test.log 2>&1 || { grep -E "error:|failed" test.log | sort -u | head -80; tail -60 test.log; exit 1; }
          grep -E "==== DESIGN" test.log || true
          ls design-screens | wc -l
          cat design-screens/report-*.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-screens
          path: design-screens
          if-no-files-found: ignore

      - name: Commit screenshots to design/<version>/screens
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed 's/.*: *//; s/"//g' | cut -d. -f1,2)
          DEST="design/$VERSION/screens"
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp design-screens/*.png "$DEST"/
          cp design-screens/report-*.txt "$DEST"/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Design screens $VERSION: $(ls "$DEST"/*.png | wc -l | tr -d ' ') screenshots"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
